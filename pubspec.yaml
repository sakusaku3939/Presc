name: presc
description: A new Flutter project.

publish_to: 'none'

version: 1.5.1+24

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  provider: ^6.1.5+1

  intl: ^0.20.3
  path: ^1.9.1
  sqflite: ^2.4.4+1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  flutter_dotenv: ^6.0.1

  speech_to_text: ^7.5.0
  flutter_scale_tap: ^1.0.5
  flutter_keyboard_visibility: ^7.0.1
  fading_edge_scrollview: ^4.1.1
  flutter_colorpicker: ^1.1.0
  share_plus: ^13.3.1
  flutter_sharing_intent: ^2.0.4
  dots_indicator: ^5.0.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  flutter_staggered_animations: ^1.1.1
  in_app_review: ^2.0.12
  vibration: ^3.2.1
  vibration_web: ^1.6.8
  http: ^1.6.0
  file_picker: ^13.1.0
  sound_mode_advanced: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.17

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/screenshot/
    - assets/images/en/
    - assets/images/en/screenshot/
    - .env

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  image_path_ios: "assets/images/icon_ios.png"
  adaptive_icon_background: "#FF6E42"
  adaptive_icon_foreground: "assets/images/foreground.png"

flutter_native_splash:
  image: "assets/images/splash.png"
  color: "#FF6E42"

flutter_intl:
  enabled: true
